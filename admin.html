<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sublime'K — Connexion</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef0df;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .box {
      background: white;
      width: 90%;
      max-width: 400px;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      color: #6f7650;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      background: #7d8558;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #resultat {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🌿 Sublime'K</h1>
  <h2>Administration</h2>

  <input
    type="email"
    id="email"
    value="Sublime-k.by.jessica@proton.me"
  >

  <input
    type="password"
    id="password"
    placeholder="Mot de passe"
  >

  <button id="connexion">
    🔐 Se connecter
  </button>

  <p id="resultat"></p>

</div>

<script>

const URL_SUPABASE =
"https://buputlhpgaenlwwbrwwf.supabase.co";

const CLE_SUPABASE =
"sb_publishable_mjzAOL92PWfc3v59ZxdSUw_69xCaInq";

const client =
window.supabase.createClient(
  URL_SUPABASE,
  CLE_SUPABASE
);

document
.getElementById("connexion")
.addEventListener("click", async function() {

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const resultat =
    document.getElementById("resultat");

  resultat.textContent =
    "⏳ Connexion en cours...";

  const { data, error } =
  await client.auth.signInWithPassword({
    email: email.trim(),
    password: password
  });

console.log("EMAIL :", email);
console.log("ERREUR :", error);
console.log("DATA :", data);

  if (error) {

    resultat.textContent =
      "❌ " + error.message;

  } else {

    resultat.textContent =
      "✅ Connexion réussie !";

  }

});

</script>

</body>
</html>
